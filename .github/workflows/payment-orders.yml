name: Payment and order integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payment-orders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  payment-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: brewlite_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d brewlite_payment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/brewlite_payment_test?schema=public
      PAYMENT_MOCK_RESULT: SUCCESS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run test:payments
